[project]
name = "app-forge"
version = "0.1.0"
description = "Forge station: dbt-based cleaning and standardization of Fortress data for research."
readme = "README.md"
authors = [
    { name = "Xing Xing", email = "x.xing.life@gmail.com" }
]
requires-python = ">=3.11"

dependencies = [
    "pydantic",
    "pyyaml",
    "duckdb",
    "dbt-core",
    "dbt-duckdb",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]
mcphost = [
    "httpx",
    "mcp",
    "starlette",
    "uvicorn",
    "pyjwt[crypto]",
]
webhost = [
    "httpx",
    "jinja2",
    "starlette",
    "uvicorn",
    "pyjwt[crypto]",
]

[project.scripts]
forge = "app.cline:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["logs*", "tests*"]

[tool.ruff]
line-length = 120
target-version = "py311"
fix = true

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["app"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
